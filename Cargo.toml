[workspace]
members = [
    "crates/core",
    "crates/crypto",
    "crates/db",
    "crates/discovery",
    "crates/network",
    "crates/chat",
    "crates/storage",
    "crates/web",
    "crates/reputation",
    "crates/vote",
    "crates/trust",
    "app",
    "ui"
]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Networking
# Noise Protocol Framework — аутентифицированное шифрование всех TCP-каналов.
snow = { version = "0.10", default-features = false, features = ["std", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }

# Crypto
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand_core = "0.6"
hmac = "0.12"
blake3 = "1"
chacha20poly1305 = "0.10"
gethostname = "0.4"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Database
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio", "macros"] }

# Web server
axum = "0.7"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utils
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
rand = "0.8"
bytes = "1"

# Тесты
tempfile = "3"

#egui
eframe = { version = "0.27", features = ["default"] }
egui = "0.27"
egui_extras = { version = "0.27", features = ["image"] }

# Ctrl+V / Ctrl+C / Ctrl+X не работали в текстовых полях при русской раскладке
# (egui 0.27). Копия egui-winit с переносом исправления из egui 0.28 — см.
# third_party/egui-winit/VOID-PATCH.md. Удалить при переходе на egui 0.28+.
[patch.crates-io]
egui-winit = { path = "third_party/egui-winit" }
