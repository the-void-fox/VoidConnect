[package]
name = "void-web"
version = "0.1.0"
edition = "2024"

[dependencies]
void-core    = { path = "../core" }
void-crypto  = { path = "../crypto" }
void-storage = { path = "../storage" }
void-db      = { path = "../db" }

tokio      = { workspace = true }
axum       = { workspace = true, features = ["ws"] }
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }
hex        = { workspace = true }
chrono     = { workspace = true }
tracing    = { workspace = true }
thiserror  = { workspace = true }
# JS API: записи сайтов (рантайм-запросы), потоки ответов, имена временных файлов.
sqlx         = { workspace = true }
futures-util = "0.3"
rand         = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Запросы к роутеру в тестах API без сети.
tower          = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# WebSocket-клиент для теста живых событий.
tokio-tungstenite = "0.21"

